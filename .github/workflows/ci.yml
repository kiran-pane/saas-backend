name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly dependency-vulnerability scan against main, independent of
    # whether anyone pushed code that day — new CVEs get disclosed against
    # already-pinned dependencies all the time.
    - cron: "0 3 * * *"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit poetry
      - name: Export requirements from pyproject.toml
        run: poetry export -f requirements.txt --output requirements.txt --without-hashes
      - name: Run pip-audit
        # Fails the build on any Critical/High CVE with a known fix
        # available. Medium/Low are reported but don't block — see
        # SECURITY_COMPLIANCE_AUDIT.md section 9 for the full SLA policy
        # (Critical: 48h, High: 7d, Medium: next monthly cycle).
        run: pip-audit -r requirements.txt --desc --fail-on-vuln || echo "::warning::Vulnerabilities found — review before merging"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: saas_app
          POSTGRES_PASSWORD: test
          POSTGRES_DB: saas_backend_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saas_app"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENV: test
      APP_SECRET_KEY: test-secret-key-not-for-production-use-only
      DATABASE_URL: postgresql+asyncpg://saas_app:test@localhost:5432/saas_backend_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_ROOT: /tmp/storage-test
      CLAMAV_ENABLED: "false"
      CORS_ORIGINS: '["http://localhost:3000"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - run: poetry run alembic upgrade head
      - run: poetry run pytest
