[tool.poetry]
name = "saas-backend"
version = "0.1.0"
description = "Multi-tenant SaaS backend with FastAPI, RBAC, and LangChain/LangGraph LLM integration"
authors = ["Your Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.35" }
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.3"
redis = "^5.0.8"
celery = "^5.4.0"
argon2-cffi = "^23.1.0"
pyjwt = "^2.9.0"
orjson = "^3.10.7"
structlog = "^24.4.0"
prometheus-fastapi-instrumentator = "^7.0.0"
prometheus-client = "^0.21.0"
opentelemetry-distro = "^0.48b0"
opentelemetry-exporter-otlp = "^1.27.0"
opentelemetry-instrumentation-fastapi = "^0.48b0"
opentelemetry-instrumentation-sqlalchemy = "^0.48b0"
opentelemetry-instrumentation-redis = "^0.48b0"
langchain = "^0.3.0"
langchain-openai = "^0.2.0"
langchain-anthropic = "^0.2.0"
langchain-text-splitters = "^0.3.0"
langchain-experimental = "^0.3.0"
langgraph = "^0.2.28"
langgraph-checkpoint-postgres = "^2.0.1"
psycopg = { extras = ["binary", "pool"], version = "^3.2.1" }
langsmith = "^0.1.129"
pgvector = "^0.3.4"
httpx = "^0.27.2"
google-auth = "^2.35.0"
requests = "^2.32.3"

# ---- Storage abstraction layer ----
aiofiles = "^24.1.0"
aioboto3 = "^13.2.0"                 # S3
google-cloud-storage = "^2.18.2"     # GCS
azure-storage-blob = "^12.23.0"      # Azure Blob
cloudinary = "^1.41.0"
python-magic = "^0.4.27"             # MIME sniffing (requires libmagic on the host/container)
clamd = "^1.0.2"                     # ClamAV client
pypdf = "^5.0.1"                     # PDF text extraction
python-docx = "^1.1.2"               # DOCX text extraction

# ---- Payments ----
stripe = "^11.1.0"
razorpay = "^1.4.2"
# PayPal uses plain httpx (already declared above) against its REST API —
# no official/maintained PayPal SDK needed for the Orders v2 + webhook-
# verification endpoints used in app/payments/providers/paypal_provider.py

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
ruff = "^0.6.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
